name: CI

on:
  push:
    branches:
      - main
    paths:
      - "apps/openfit/**"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
      - ".changeset/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/docker-publish.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/openfit/**"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
      - ".changeset/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/docker-publish.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run lint
        run: bunx turbo run lint --filter=openfit

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests with coverage
        run: bunx turbo run test:coverage --filter=openfit

  e2e-docker:
    name: Docker Playwright E2E
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: http://127.0.0.1:3100
      BETTER_AUTH_BASE_URL: http://127.0.0.1:3100
      BETTER_AUTH_SECRET: 2c0f9f7d8b6944f4b0d5e7a9c1b3e6d8
      ADMIN_USER: e2e-admin@example.com
      ADMIN_PASSWORD: e2e-admin-password-123!
      SKIP_EXERCISE_IMAGE_DOWNLOADS: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: apps/openfit
        run: bunx playwright install --with-deps chromium

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/openfit/Dockerfile
          load: true
          tags: openfit:e2e
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start Docker container
        run: |
          docker run --detach \
            --name openfit-e2e \
            --publish 3100:3000 \
            --env BETTER_AUTH_BASE_URL \
            --env BETTER_AUTH_SECRET \
            --env ADMIN_USER \
            --env ADMIN_PASSWORD \
            --env SKIP_EXERCISE_IMAGE_DOWNLOADS \
            openfit:e2e

      - name: Wait for Docker app readiness
        run: |
          timeout 180 bash -c 'until curl --fail --silent "$E2E_BASE_URL/api/health"; do docker logs --tail 50 openfit-e2e; sleep 5; done'

      - name: Run Playwright PR suite
        working-directory: apps/openfit
        run: bun run test:e2e:pr

      - name: Capture Docker logs
        if: failure()
        run: docker logs openfit-e2e > docker-openfit.log 2>&1 || true

      - name: Upload Docker logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-openfit-logs
          path: docker-openfit.log
          if-no-files-found: ignore

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            apps/openfit/playwright-report
            apps/openfit/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop Docker container
        if: always()
        run: docker rm --force openfit-e2e || true
